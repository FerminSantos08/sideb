[project]
name = "side-b-api"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "bcrypt>=5.0.0",
    "email-validator>=2.3.0",
    "fastapi>=0.162.0",
    "mysql-connector-python>=26.10.0",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
